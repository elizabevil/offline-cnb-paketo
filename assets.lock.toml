[[asset]]
# Go SDK 压缩包：BK 的 go buildpack 要求本地预置，离线构建用
id = "go-sdk"
version = "1.27.4"
default = true

  [asset.info]
  name     = "Go SDK tarball（BK 离线构建用）"
  homepage = "https://go.dev/dl/"
  license  = "BSD-3-Clause"

  [asset.unpack]
  kind   = "bin"
  strip  = 0
  dir    = "go-sdk/{version}"
  expect = ["go-sdk"]

  [asset.platform.linux-amd64]
  url    = "https://mirrors.aliyun.com/golang/go{version}.linux-amd64.tar.gz"
  size   = 70680823
  sha256 = "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840"

  [asset.platform.linux-arm64]
  url    = "https://mirrors.aliyun.com/golang/go{version}.linux-arm64.tar.gz"
  sha256 = ""

[[asset]]
# 本仓库自研 CLI：本地构建后发布为物料（[asset.local]）
id = "cnb"
version = "3.0.0"
default = true

  [asset.info]
  name     = "cnb CLI（本地构建）"
  homepage = "https://github.com/debi/learn-cnb-paketo"
  license  = "MIT"

  [asset.local]
  source = "script/bin/cnb-linux-amd64"
  sha256 = "32719d7ba9c9777c7fc63c527edb1066f8fa8d184d214846444a68ea808e62a0"

  [asset.unpack]
  kind   = "bin"
  strip  = 0
  dir    = "cnb/{version}"
  expect = ["cnb"]
