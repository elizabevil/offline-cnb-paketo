# =============================================================================
# assets.lock.toml — 物料清单（唯一事实源）
# -----------------------------------------------------------------------------
# 每条物料按作用域分区：
#
#   [[asset]]                     身份：id / version / default
#     [asset.info]                元信息：name / homepage / license（不参与构建）
#     [asset.unpack]              解包：kind / strip / dir / expect
#                                 dir 支持 {version}；expect 相对 dir
#     [asset.platform.<platform>] 下载源：url / sha256
#                                 url 支持 {version}，架构命名保持字面量
#
# 约定：
#   - 同一 id 可有多版本；default = true 表示省略版本时的选择
#   - 不同版本的 unpack.dir 必须不同，否则解压会互相覆盖（validate 会报错）
#   - sha256 / size 由 `cnb materials sync` 自动回填，不要手写
#   - 维护指南见 docs/ai/adding-materials.md
# =============================================================================

schema = 1

# 物料落盘位置：root 相对本文件所在目录，layout 决定 bundle 内层级
[storage]
root   = "bundle"
layout = "arch-first"

[meta]
name = "learn-cnb-paketo"
description = "CNB / Paketo 离线构建物料基座"
provenance = "local-capture"
captured_at = "2026-11-12"
platforms = ["linux-amd64", "linux-arm64"]

[[asset]]
# CNB 生命周期：detector/builder/analyzer/exporter 等，四阶段执行器
id = "lifecycle"
version = "0.21.29"
default = true

  [asset.info]
  name = "CNB Lifecycle"
  homepage = "https://github.com/buildpacks/lifecycle"
  license = "Apache-2.0"

  # unpack：kind 解包方式；strip 去掉顶层目录；dir 落盘位置（支持 {version}）；
  #         expect 是相对 binaries/ 的必需产物，verify/sync 用它判断是否就绪
  [asset.unpack]
  kind = "tgz"
  strip = 1
  dir = "lifecycle/{version}"
  expect = ["detector", "analyzer", "builder", "exporter", "launcher"]

  # 每个平台一个块：url 中 {version} 会被替换成上面的 version；
  #   sha256 由 `cnb materials sync` 回填，未固定时 verify 会告警
  [asset.platform.linux-amd64]
  url = "https://github.com/buildpacks/lifecycle/releases/download/v{version}/lifecycle-v{version}+linux.x86-64.tgz"
  size   = 11161939
  sha256 = "d261ccc62f8b00f4c63d7d137b371f369eb706e3ab6aedb3ff67eda4aa7d1ac2"

  [asset.platform.linux-arm64]
  url = "https://github.com/buildpacks/lifecycle/releases/download/v{version}/lifecycle-v{version}+linux.arm64.tgz"
  sha256 = ""

[[asset]]
# 克隆 Node 版本管理器（自研 node-engine 用它安装 Node）
id = "fnm"
version = "1.39.0"
default = true

  [asset.info]
  name = "fnm"
  homepage = "https://github.com/Schniz/fnm"
  license = "GPL-3.0"

  [asset.unpack]
  kind = "zip"
  strip = 0
  dir = "fnm/{version}"
  expect = ["fnm"]

  [asset.platform.linux-amd64]
  url = "https://github.com/Schniz/fnm/releases/download/v{version}/fnm-linux.zip"
  size   = 3360953
  sha256 = "7807664f39d39fc518da1c35ba0181e4b3267603c4b1dedeb4b5fc6ae440a224"

  [asset.platform.linux-arm64]
  url = "https://github.com/Schniz/fnm/releases/download/v{version}/fnm-arm64.zip"
  sha256 = ""

[[asset]]
# Python 包管理器（自研 cpython/pip-install 用它）
id = "uv"
version = "0.13.8"
default = true

  [asset.info]
  name = "uv"
  homepage = "https://github.com/astral-sh/uv"
  license = "Apache-2.0"

  [asset.unpack]
  kind = "tgz"
  strip = 1
  dir = "uv/{version}"
  expect = ["uv", "uvx"]

  [asset.platform.linux-amd64]
  url = "https://github.com/astral-sh/uv/releases/download/{version}/uv-x86_64-unknown-linux-musl.tar.gz"
  size   = 18577654
  sha256 = "61fb26dabc4f0cf1d050fc6c67d40e43e4fae2994af21ebc1e050b233bf2b5ed"

  [asset.platform.linux-arm64]
  url = "https://github.com/astral-sh/uv/releases/download/{version}/uv-aarch64-unknown-linux-musl.tar.gz"
  sha256 = ""

[[asset]]
# Docker CLI：仅镜像内工具（builder 里导出/导入镜像用），不是运行时
id = "docker"
version = "27.0.3"
default = true

  [asset.info]
  name = "Docker CLI"
  homepage = "https://docs.docker.com/engine/install/binaries/"
  license = "Apache-2.0"

  [asset.unpack]
  kind = "tgz"
  strip = 0
  dir = "docker/{version}"
  expect = ["docker/dockerd"]

  [asset.platform.linux-amd64]
  url = "https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/static/stable/x86_64/docker-{version}.tgz"
  size   = 73823487
  sha256 = "f6299aeada422d527cba35061fe56df5e2294776f6d39b7830d699335054b1e6"

  [asset.platform.linux-arm64]
  url = "https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/static/stable/aarch64/docker-{version}.tgz"
  sha256 = ""

