# ─── offline-paketo 流水线 ───────────────────────────────────────────────────
# 分区：项目信息 / 构建参数 / 物料 / 镜像 / 命令
# 改版本 → [assets.*]；改镜像 → [images.*]；改流程顺序 → after

schema = 1

[project]
name     = "offline-paketo"
dir      = "project/offline-paketo"
platform = "linux-amd64"

[docker]
buildpacks_context = "buildpacks/paketo"
context       = "project/offline-paketo"   # docker build 上下文（项目目录）
bundle_layout = "arch-first"  # bundle/<platform>/{archives,binaries}

# ── 物料：键名即 id；version 省略则取 lock 的 default ───────────────────────
[assets.lifecycle]
version = "0.21.29"

[assets.fnm]
version = "1.39.0"

[assets.uv]
version = "0.13.8"

# ── 镜像：键名即阶段名；after 决定顺序 ──────────────────────────────────────
[images.base]
desc       = "系统依赖层：apt / CA 证书 / curl / unzip"
dockerfile = "docker/base.dockerfile"
tag        = "offline-builder-base:latest"
args       = { BASE_IMAGE = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim" }

[images.run]
desc       = "运行时层：glibc 基础镜像（Node/Python 二进制需要 glibc，不能用 alpine/musl）"
dockerfile = "docker/run.dockerfile"
tag        = "offline-run:latest"
args       = { BASE_IMAGE = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim" }

[images.builder]
inject_versions = ["lifecycle", "fnm", "uv"]
desc       = "构建层：lifecycle + node/python/procfile buildpack"
dockerfile = "docker/builder.dockerfile"
tag        = "offline-builder:latest"
args       = { BASE_IMAGE_TAG = "${image.base.tag}", PROCFILE_BP_TAG = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/paketobuildpacks/procfile:5.13.4" }

# ── 流程：顺序即数组顺序 ──────────────────────────────────────────────────

[[stage]]
image = "base"

[[stage]]
image = "run"

[[stage]]
image = "builder"
