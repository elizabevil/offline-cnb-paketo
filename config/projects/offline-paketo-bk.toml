# ─── offline-paketo-bk 流水线 ────────────────────────────────────────────────

schema = 1

[project]
name     = "offline-paketo-bk"
dir      = "project/offline-paketo-bk"
platform = "linux-amd64"

[docker]
context       = "project/offline-paketo-bk"   # docker build 上下文（项目目录）
bundle_layout = "arch-first"

[assets.lifecycle]
version = "0.21.29"

[assets.fnm]
version = "1.39.0"

[assets.uv]
version = "0.13.8"

[assets.docker]
version = "27.0.3"

[assets.jq]
version = "1.8.2"

[assets.yq]
version = "4.54.3"

[assets.pack]
version = "0.40.11"

[images.base]
desc       = "系统依赖层：apt / CA 证书 / curl"
dockerfile = "docker/Dockerfile.builder-base"
tag        = "offline-builder-base-bk:latest"
args       = { BASE_IMAGE = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim" }

[images.run]
desc       = "运行时层：alpine 最小根"
dockerfile = "docker/Dockerfile.run"
tag        = "offline-run-bk:latest"
args       = { BASE_IMAGE = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.24.0" }

[images.builder]
inject_versions = ["lifecycle", "fnm", "uv", "docker", "jq", "yq", "pack"]
desc       = "构建层：lifecycle + 4 buildpack + docker/jq/yq/pack"
dockerfile = "docker/Dockerfile.builder-build"
tag        = "offline-builder-build-bk:latest"
args       = { BASE_IMAGE_TAG = "${image.base.tag}", BUNDLE_ARCH = "${platform}" }

# ── 命令：打包（examples/ 不入库，本地需存在）────────────────────────────────
[commands.package]
run   = "examples/build.sh"
workdir = "project/offline-paketo-bk"

# ── 流程：顺序即数组顺序 ──────────────────────────────────────────────────

[[stage]]
image = "base"

[[stage]]
image = "run"

[[stage]]
image = "builder"

[[stage]]
command = "package"
