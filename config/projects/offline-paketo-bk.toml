apiVersion = "cnb/v1"
kind       = "Pipeline"

[metadata]
name = "offline-paketo-bk"

[spec.project]
dir      = "project/offline-paketo-bk"
platform = "linux-amd64"

[spec.assets.lifecycle]
version = "0.21.29"

[spec.assets.fnm]
version = "1.39.0"

[spec.assets.uv]
version = "0.13.8"

[spec.assets.docker]
version = "27.0.3"

[spec.assets.jq]
version = "1.8.2"

[spec.assets.yq]
version = "4.54.3"

[spec.assets.pack]
version = "0.40.11"

[spec.assets.cnb]
version = "3.0.0"

[[spec.stages]]
name    = "base"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build",
  "-f", "docker/builder-base.dockerfile",
  "-t", "offline-builder-base-bk:latest",
  "--build-arg", "BASE_IMAGE=swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim",
  ".",
]

[[spec.stages]]
name    = "run"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build",
  "-f", "docker/run.dockerfile",
  "-t", "offline-run-bk:latest",
  "--build-arg", "BASE_IMAGE=swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim",
  ".",
]

[[spec.stages]]
name    = "builder"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build",
  "-f", "docker/builder-build.dockerfile",
  "-t", "offline-builder-build-bk:latest",
  "--build-context", "bundle=${bundle}",
  "--build-context", "buildpacks=${repo}/buildpacks/paketo",
  "--build-arg", "BASE_IMAGE_TAG=offline-builder-base-bk:latest",
  "--build-arg", "BP_GO_MIRROR=http://192.168.11.4:5000/",
  "--build-arg", "BUNDLE_ARCH=${platform}",
  "--build-arg", "LIFECYCLE_VERSION=${asset.lifecycle.version}",
  "--build-arg", "FNM_VERSION=${asset.fnm.version}",
  "--build-arg", "UV_VERSION=${asset.uv.version}",
  "--build-arg", "DOCKER_VERSION=${asset.docker.version}",
  "--build-arg", "JQ_VERSION=${asset.jq.version}",
  "--build-arg", "YQ_VERSION=${asset.yq.version}",
  "--build-arg", "PACK_VERSION=${asset.pack.version}",
  "--build-arg", "CNB_VERSION=${asset.cnb.version}",
  ".",
]
