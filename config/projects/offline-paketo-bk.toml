# offline-paketo-bk 构建流水线
#   校验：cnb pipeline profile validate config/projects/offline-paketo-bk.toml
#   计划：cnb pipeline plan config/projects/offline-paketo-bk.toml
#   检查：cnb lint config/projects/offline-paketo-bk.toml
#   占位符：见下方说明；自省用 cnb pipeline variables config/projects/offline-paketo-bk.toml

apiVersion = "cnb/v1"
kind       = "Pipeline"

[metadata]
name = "offline-paketo-bk"

# ── 占位符（run 与 spec.checks 通用；未知占位符在 plan 阶段报错）──────────
#   一律使用配置里的完整路径，不用短名，避免歧义。
#
#   ${spec.project.platform}       目标平台，如 linux-amd64
#                                  ← [spec.project] platform
#   ${spec.project.directory}      项目目录，如 project/offline-paketo
#                                  ← [spec.project] dir
#   ${spec.project.base}           当前平台的基础镜像
#                                  ← [spec.project.base] 里 platform 对应的值
#   ${derived.architecture}        架构，如 amd64
#                                  ← 由 spec.project.platform 派生
#   ${derived.container_platform}  linux/amd64，供 docker build --platform
#                                  ← 由 spec.project.platform 把首个 "-" 换成 "/"
#   ${runtime.repo}                仓库根绝对路径
#                                  ← --repo / CNB_REPO_ROOT / 可执行文件位置
#   ${runtime.bundle}              物料目录绝对路径
#                                  ← --bundle 或 lock 同级 bundle/
#   ${spec.assets.<id>.version}    物料版本
#                                  ← [spec.assets.<id>] version（缺省取 lock）
#
#   自省：cnb pipeline variables config/projects/<name>.toml

[spec.project]
directory = "project/offline-paketo-bk"
platform = "linux-amd64"

  [spec.project.base]
  linux-amd64 = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim"
  linux-arm64 = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim-linuxarm64"

[spec.assets.lifecycle]
version = "0.21.29"

[spec.assets.fnm]
version = "1.39.0"

[spec.assets.uv]
version = "0.13.8"

[spec.assets.jq]
version = "1.8.2"

[spec.assets.yq]
version = "4.54.3"

[spec.assets.pack]
version = "0.40.11"

[spec.assets.cnb]
version = "3.0.0"

[spec.assets.procfile]
version = "5.15.9"

[[spec.stages]]
name    = "base"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build", "-f", "docker/builder-base.dockerfile",
  "-t", "offline-builder-base-bk:${derived.architecture}", "--platform", "${derived.container_platform}",
  "--build-arg", "BASE_IMAGE=${spec.project.base}", ".",
]

[[spec.stages]]
name    = "builder"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build", "-f", "docker/builder-build.dockerfile",
  "-t", "offline-builder-build-bk:${derived.architecture}", "--platform", "${derived.container_platform}",
  "--build-arg", "BASE_IMAGE_TAG=offline-builder-base-bk:${derived.architecture}", "--build-arg", "BP_GO_MIRROR=https://mirrors.aliyun.com/golang/",
  "--build-arg", "BP_GO_VERSION=1.27.4", "--build-arg", "BUNDLE_ARCH=${spec.project.platform}",
  "--build-arg", "LIFECYCLE_VERSION=${spec.assets.lifecycle.version}", "--build-arg", "FNM_VERSION=${spec.assets.fnm.version}",
  "--build-arg", "UV_VERSION=${spec.assets.uv.version}", "--build-arg", "JQ_VERSION=${spec.assets.jq.version}",
  "--build-arg", "YQ_VERSION=${spec.assets.yq.version}", "--build-arg", "PACK_VERSION=${spec.assets.pack.version}",
  "--build-arg", "CNB_VERSION=${spec.assets.cnb.version}", "--build-arg", "PROCFILE_VERSION=${spec.assets.procfile.version}",
  "--build-arg", "BUILDPACK_ARCH=${derived.architecture}", "--build-context", "bundle=${runtime.bundle}",
  "--build-context", "buildpacks=${runtime.repo}/buildpacks/paketo", ".",
]

# ── 静态检查：Dockerfile 的 COPY 源 ──

[[spec.checks.dockerfiles]]
path = "docker/builder-base.dockerfile"

[[spec.checks.dockerfiles]]
path = "docker/builder-build.dockerfile"
args = { BUNDLE_ARCH = "${spec.project.platform}", LIFECYCLE_VERSION = "${spec.assets.lifecycle.version}", FNM_VERSION = "${spec.assets.fnm.version}", UV_VERSION = "${spec.assets.uv.version}", CNB_VERSION = "${spec.assets.cnb.version}", JQ_VERSION = "${spec.assets.jq.version}", YQ_VERSION = "${spec.assets.yq.version}", PACK_VERSION = "${spec.assets.pack.version}" }
contexts = { bundle = "${runtime.bundle}", buildpacks = "${runtime.repo}/buildpacks/paketo" }