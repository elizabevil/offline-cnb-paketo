# offline-paketo-bk 构建流水线
#   校验：cnb pipeline profile validate config/projects/offline-paketo-bk.toml
#   计划：cnb pipeline plan config/projects/offline-paketo-bk.toml
#   检查：cnb lint config/projects/offline-paketo-bk.toml
#   占位符：见下方说明；自省用 cnb pipeline variables config/projects/offline-paketo-bk.toml

apiVersion = "cnb/v1"
kind       = "Pipeline"

[metadata]
name = "offline-paketo-bk"

# ── 可用占位符（run 与 spec.checks 通用；未知占位符在 plan 阶段报错）──────
#   ${platform}            目标平台，如 linux-amd64        ← spec.project.platform
#   ${arch}                架构，如 amd64                  ← 由 platform 派生
#   ${oci_platform}        linux/amd64（docker --platform）← platform 首个 "-" 换成 "/"
#   ${base_image}          基础镜像                        ← spec.project.base[platform]
#   ${bundle}              物料目录绝对路径                ← --bundle 或 lock 同级 bundle/
#   ${repo}                仓库根绝对路径                  ← --repo / CNB_REPO_ROOT
#   ${asset.<id>.version}  物料版本                        ← spec.assets.<id>.version（缺省取 lock）
#   自省：cnb pipeline variables config/projects/<name>.toml

[spec.project]
dir      = "project/offline-paketo-bk"
platform = "linux-amd64"

  [spec.project.base]
  linux-amd64 = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim"
  linux-arm64 = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim-linuxarm64"

[spec.assets.lifecycle]
version = "0.21.29"

[spec.assets.fnm]
version = "1.39.0"

[spec.assets.uv]
version = "0.13.8"

[spec.assets.jq]
version = "1.8.2"

[spec.assets.yq]
version = "4.54.3"

[spec.assets.pack]
version = "0.40.11"

[spec.assets.cnb]
version = "3.0.0"

[spec.assets.procfile]
version = "5.15.9"

[[spec.stages]]
name    = "base"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build", "-f", "docker/builder-base.dockerfile",
  "-t", "offline-builder-base-bk:${arch}", "--platform", "${oci_platform}",
  "--build-arg", "BASE_IMAGE=${base_image}", ".",
]

[[spec.stages]]
name    = "builder"
workdir = "project/offline-paketo-bk"
run = [
  "podman", "build", "-f", "docker/builder-build.dockerfile",
  "-t", "offline-builder-build-bk:${arch}", "--platform", "${oci_platform}",
  "--build-arg", "BASE_IMAGE_TAG=offline-builder-base-bk:${arch}", "--build-arg", "BP_GO_MIRROR=https://mirrors.aliyun.com/golang/",
  "--build-arg", "BP_GO_VERSION=1.27.4", "--build-arg", "BUNDLE_ARCH=${platform}",
  "--build-arg", "LIFECYCLE_VERSION=${asset.lifecycle.version}", "--build-arg", "FNM_VERSION=${asset.fnm.version}",
  "--build-arg", "UV_VERSION=${asset.uv.version}", "--build-arg", "JQ_VERSION=${asset.jq.version}",
  "--build-arg", "YQ_VERSION=${asset.yq.version}", "--build-arg", "PACK_VERSION=${asset.pack.version}",
  "--build-arg", "CNB_VERSION=${asset.cnb.version}", "--build-arg", "PROCFILE_VERSION=${asset.procfile.version}",
  "--build-arg", "BUILDPACK_ARCH=${arch}", "--build-context", "bundle=${bundle}",
  "--build-context", "buildpacks=${repo}/buildpacks/paketo", ".",
]

# ── 静态检查：Dockerfile 的 COPY 源 ──

[[spec.checks.dockerfiles]]
path = "docker/builder-base.dockerfile"

[[spec.checks.dockerfiles]]
path = "docker/builder-build.dockerfile"
contexts = { bundle = "${bundle}", buildpacks = "${repo}/buildpacks/paketo" }