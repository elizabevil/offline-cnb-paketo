# offline-paketo 构建流水线
#   校验：cnb pipeline profile validate project/offline-paketo/pipeline.toml
#   计划：cnb pipeline plan project/offline-paketo/pipeline.toml
#   检查：cnb lint project/offline-paketo/pipeline.toml
#   占位符：见下方说明；自省用 cnb pipeline variables project/offline-paketo/pipeline.toml

apiVersion = "cnb/v1"
kind       = "Pipeline"

[metadata]
name = "offline-paketo"

# ── 占位符（run 与 spec.checks 通用；未知占位符在 plan 阶段报错）──────────
#   一律使用配置里的完整路径，不用短名，避免歧义。
#
#   ${spec.project.platform}       目标平台，如 linux-amd64
#                                  ← [spec.project] platform
#   ${spec.project.directory}      项目目录，如 project/offline-paketo
#                                  ← [spec.project] dir
#   ${spec.project.base}           当前平台的基础镜像
#                                  ← [spec.project.base] 里 platform 对应的值
#   ${derived.architecture}        架构，如 amd64
#                                  ← 由 spec.project.platform 派生
#   ${derived.container_platform}  linux/amd64，供 docker build --platform
#                                  ← 由 spec.project.platform 把首个 "-" 换成 "/"
#   ${runtime.repo}                仓库根绝对路径
#                                  ← --repo / CNB_REPO_ROOT / 可执行文件位置
#   ${runtime.bundle}              物料目录绝对路径
#                                  ← --bundle 或 lock 同级 bundle/
#   ${spec.assets.<id>.version}    物料版本
#                                  ← [spec.assets.<id>] version（缺省取 lock）
#
#   自省：cnb pipeline variables project/<name>/pipeline.toml

[spec.project]
directory = "project/offline-paketo"
platform = "linux-amd64"

  [spec.project.base]
  linux-amd64 = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim"
  linux-arm64 = "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:trixie-slim-linuxarm64"

[spec.assets.cnb]
version = "3.0.0"

[spec.assets.procfile]
version = "5.15.9"

[spec.assets.lifecycle]
version = "0.21.29"

[spec.assets.fnm]
version = "1.39.0"

[spec.assets.uv]
version = "0.13.8"

[[spec.stages]]
name        = "base"
description = "构建 base 镜像（证书、locale、工作目录）"
workdir     = "project/offline-paketo"
run = [
  "podman", "build", "-f", "docker/base.dockerfile",
  "-t", "offline-builder-base:${derived.architecture}", "--platform", "${derived.container_platform}",
  "--build-arg", "BASE_IMAGE=${spec.project.base}", ".",
]

[[spec.stages]]
name        = "builder"
description = "构建 builder 镜像（lifecycle + buildpacks）"
workdir     = "project/offline-paketo"
run = [
  "podman", "build", "-f", "docker/builder.dockerfile",
  "-t", "offline-builder:${derived.architecture}", "--platform", "${derived.container_platform}",
  "--build-arg", "BASE_IMAGE_TAG=offline-builder-base:${derived.architecture}", "--build-arg", "BUNDLE_ARCH=${spec.project.platform}",
  "--build-arg", "LIFECYCLE_VERSION=${spec.assets.lifecycle.version}", "--build-arg", "FNM_VERSION=${spec.assets.fnm.version}",
  "--build-arg", "UV_VERSION=${spec.assets.uv.version}", "--build-arg", "CNB_VERSION=${spec.assets.cnb.version}",
  "--build-arg", "PROCFILE_VERSION=${spec.assets.procfile.version}", "--build-arg", "BUILDPACK_ARCH=${derived.architecture}",
  "--build-context", "bundle=${runtime.bundle}", "--build-context", "buildpacks=${runtime.repo}/buildpacks/paketo",
  ".",
]

# ── 静态检查：Dockerfile 的 COPY 源 ──

[[spec.checks.dockerfiles]]
path = "docker/base.dockerfile"

[[spec.checks.dockerfiles]]
path = "docker/builder.dockerfile"
args = { BUNDLE_ARCH = "${spec.project.platform}", LIFECYCLE_VERSION = "${spec.assets.lifecycle.version}", FNM_VERSION = "${spec.assets.fnm.version}", UV_VERSION = "${spec.assets.uv.version}", CNB_VERSION = "${spec.assets.cnb.version}" }
contexts = { bundle = "${runtime.bundle}", buildpacks = "${runtime.repo}/buildpacks/paketo" }