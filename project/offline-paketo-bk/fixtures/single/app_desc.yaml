specVersion: 3
appVersion: 0.0.1
app:
  bkAppCode: "fixture-single"
  bkAppName: "单模块夹具"
modules:
  - name: default
    language: "Go"
    isDefault: true
    sourceDir: "."
    spec:
      processes:
        - name: web
          procCommand: ./workspace/app
      build:
        buildpacks:
          - name: bk-buildpack-go
      configuration:
        env:
          # Go SDK 下载源：内网镜像优先（组件读取 BP_GO_MIRROR）
          - name: BP_GO_MIRROR
            value: "http://192.168.11.4:5000/"
