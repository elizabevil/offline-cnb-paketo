api = "0.12"

[buildpack]
  id = "paketo-buildpacks/node"
  name = "Node.js Buildpack (offline)"
  version = "10.15.0"
  homepage = "https://github.com/paketo-buildpacks/node"
  description = "Detects Node.js projects (package.json), installs SDK via fnm, runs npm install"
  keywords = ["node", "npm", "node.js", "fnm"]
  sbom-formats = ["application/vnd.cyclonedx+json"]

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/node/blob/main/LICENSE"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"

[[stacks]]
  id = "io.buildpacks.stacks.bionic"

[metadata]
  # 版本号与上游对齐；实现为自研离线版
  upstream = "paketo-buildpacks/nodejs"
  upstream-version = "10.15.0"
  offline-implementation = true
