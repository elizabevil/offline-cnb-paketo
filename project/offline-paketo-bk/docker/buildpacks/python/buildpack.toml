api = "0.12"

[buildpack]
  id = "paketo-buildpacks/python"
  name = "Python Buildpack (offline)"
  version = "2.68.0"
  homepage = "https://github.com/paketo-buildpacks/python"
  description = "Detects Python projects (requirements.txt), creates venv via uv, runs pip install"
  keywords = ["python", "pip", "uv", "venv"]
  sbom-formats = ["application/vnd.cyclonedx+json"]

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/paketo-buildpacks/python/blob/main/LICENSE"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"

[[stacks]]
  id = "io.buildpacks.stacks.bionic"

[metadata]
  # 版本号与上游对齐；实现为自研离线版
  upstream = "paketo-buildpacks/python"
  upstream-version = "2.68.0"
  offline-implementation = true
