api = "0.12"

[buildpack]
  id = "paketo-buildpacks/go"
  name = "Go (offline meta)"
  version = "4.23.3"
  homepage = "https://github.com/paketo-buildpacks/go"
  description = "按 order 组合 go-dist / go-build"
  keywords = ["go", "golang"]

  [[buildpack.licenses]]
    type = "Apache-2.0"

[metadata]
  upstream = "paketo-buildpacks/go"
  upstream-version = "4.23.3"
  offline-implementation = true

[[order]]
  [[order.group]]
    id = "paketo-buildpacks/go-dist"
    version = "2.11.2"

  [[order.group]]
    id = "paketo-buildpacks/go-build"
    version = "2.4.48"
