api = "0.12"

[buildpack]
  id = "paketo-buildpacks/cpython"
  name = "CPython (offline)"
  version = "1.18.51"
  homepage = "https://github.com/paketo-buildpacks/cpython"
  description = "提供 Python 解释器：本地挂载 → layers 缓存 → uv 下载"
  keywords = ["python", "cpython", "uv"]
  sbom-formats = ["application/vnd.cyclonedx+json"]

  [[buildpack.licenses]]
    type = "Apache-2.0"

[metadata]
  [[metadata.dependencies]]
    id = "python"
    version = "3.12.7"
    uri = "https://github.com/astral-sh/uv"

