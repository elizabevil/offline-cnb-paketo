api = "0.12"

[buildpack]
  id = "paketo-buildpacks/go-build"
  name = "Go Build (offline)"
  version = "2.4.48"
  homepage = "https://github.com/paketo-buildpacks/go-build"
  sbom-formats = ["application/vnd.cyclonedx+json"]
  description = "编译 Go 应用，产物写入 launch 层"
  keywords = ["go", "build"]

  [[buildpack.licenses]]
    type = "Apache-2.0"

[[targets]]
  os = "linux"
  arch = "amd64"
