api = "0.12"

[buildpack]
  id = "paketo-buildpacks/npm-start"
  name = "npm start (offline)"
  version = "2.5.13"
  homepage = "https://github.com/paketo-buildpacks/npm-start"
  description = "为含 start 脚本的项目生成 web 进程"
  keywords = ["npm", "start", "process"]

  [[buildpack.licenses]]
