version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - misspell
    - goconst
    - dupl
    - funlen
    - gocognit
    - cyclop
    - nolintlint
    - modernize
    - intrange
    - usestdlibvars
  settings:
    errcheck:
      # CLI 输出到 stdout/stderr，写失败无补救手段，不纳入检查
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    goconst:
      # 测试里重复的夹具字符串用常量反而难读，只看生产代码
      ignore-tests: true
      min-occurrences: 3
    dupl:
      threshold: 150
    funlen:
      lines: 80
      statements: 50
    # 复杂度阈值=当前基线，只能降不能升（拆分函数后同步调低）
    gocognit:
      min-complexity: 45
    cyclop:
      max-complexity: 22
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    rules:
      # 测试代码里构造夹具时的写入失败会由后续断言暴露，不单独检查
      - path: _test\.go
        linters: [errcheck]
      # 测试代码沿用 Ginkgo/Gomega 的点导入与下划线夹具名，保持可读性
      - path: _test\.go
        linters: [revive]
        text: "dot-imports|var-naming"

issues:
  # Report every finding: the defaults silently cap repeated issues per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
